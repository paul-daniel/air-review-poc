# Continuous integration for this repository. The user-facing example that
# consumers copy into their own repos is air-review.example.yml; keep them separate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The next four steps are `npm run check`, split so the format step can be
      # tolerated until the one-off format commit lands.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: End-to-end CLI scenario (fake model endpoint)
        run: npm run test:e2e

      - name: Simulated provider run (API-key path)
        run: npm run test:api

      - name: Publishable file list
        run: npm pack --dry-run
