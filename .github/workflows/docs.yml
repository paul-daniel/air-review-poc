# Build the VitePress documentation site (website/) and deploy it to GitHub Pages.
#
# NOTE: this repository has no remote yet. The workflow is ready for the day it is
# pushed to GitHub: in the repository settings, open Settings → Pages and set
# "Build and deployment" → "Source" to "GitHub Actions". The site is served under
# https://<owner>.github.io/air-review/ (the `base` constant in
# website/.vitepress/config.mts must match the repository name).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; do not cancel a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
